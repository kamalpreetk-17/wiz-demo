<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiz Demo - Secure Todo List</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { color: #333; text-align: center; }
        .input-group { display: flex; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px 0 0 4px; font-size: 16px; }
        button { padding: 10px 20px; background-color: #0066cc; color: white; border: none; border-radius: 0 4px 4px 0; cursor: pointer; font-size: 16px; transition: background 0.3s; }
        button:hover { background-color: #005bb5; }
        ul { list-style-type: none; padding: 0; }
        li { background: #f9f9f9; padding: 15px; margin-bottom: 10px; border-radius: 4px; border-left: 5px solid #0066cc; display: flex; justify-content: space-between; align-items: center; }
        .status { font-size: 12px; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <h1>Wiz Demo Todo List</h1>
    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Enter a new task...">
        <button onclick="addTask()">Add Task</button>
    </div>
    <ul id="taskList">
        <!-- Tasks will be loaded here dynamically -->
    </ul>
</div>

<script>
    // Fetch and display tasks on load
    async function loadTasks() {
        const response = await fetch('/tasks');
        const tasks = await response.json();
        const list = document.getElementById('taskList');
        list.innerHTML = '';
        tasks.forEach(task => {
            const li = document.createElement('li');
            li.innerHTML = `<span>${task.title}</span> <span class="status">Saved in MongoDB</span>`;
            list.appendChild(li);
        });
    }

    // Add a new task
    async function addTask() {
        const input = document.getElementById('taskInput');
        const title = input.value.trim();
        if (!title) return;

        await fetch('/tasks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title })
        });
        
        input.value = ''; // clear input
        loadTasks(); // reload the list
    }

    // Initial load
    loadTasks();
</script>

</body>
</html>
