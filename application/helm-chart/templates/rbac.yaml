apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-sa
---
# VULNERABILITY: Binding the default cluster-admin role to the app
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-admin-binding
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-admin # Highly dangerous built-in role
  apiGroup: rbac.authorization.k8s.io