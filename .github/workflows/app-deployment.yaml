name: Deploy Application (Docker + Helm)

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'application/**'
  pull_request:
    branches:
      - main
    paths:
      - 'application/**'
  workflow_dispatch: 
    # Removed the manual inputs! We rely on the Environment gate now.

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: wiz-demo-app
  CLUSTER_NAME: wiz-demo-cluster

jobs:
  # ---------------------------------------------------------
  # STAGE 1: SAST (Static Application Security Testing)
  # ---------------------------------------------------------
  sast-scan:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./application
        
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"
  # ---------------------------------------------------------
  # STAGE 2: Build & SCA (Software Composition Analysis)
  # ---------------------------------------------------------
  build-and-sca:
    name: Build & Trivy SCA Scan
    needs: sast-scan
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./application
        
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      - name: Run Trivy Container Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0' 
          severity: 'CRITICAL,HIGH'

      - name: Push Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  # ---------------------------------------------------------
  # STAGE 3: Supply Chain Security (Signing & SBOM)
  # ---------------------------------------------------------
  supply-chain-security:
    name: Cosign Image Signing & SBOM Attestation
    needs: build-and-sca
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./application
        
    steps:
      - uses: actions/checkout@v4
      
      - uses: sigstore/cosign-installer@v3.1.1
      
      - run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Sign & Attest SBOM
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cosign sign --yes $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          syft packages $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -o spdx-json > sbom.json
          cosign attest --yes --predicate sbom.json --type spdxjson $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  # ---------------------------------------------------------
  # STAGE 4: Kubernetes Deploy (Pauses for Manual Approval)
  # ---------------------------------------------------------
  deploy-to-eks:
    name: Deploy to EKS via Helm
    needs: supply-chain-security
    runs-on: ubuntu-latest
    
    # THIS LINE TRIGGERS THE PAUSE!
    environment: sandbox 
    
    defaults:
      run:
        working-directory: ./application
        
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy via Helm
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install wiz-app ./helm-chart \
            --set image.repository=$REGISTRY/$ECR_REPOSITORY \
            --set image.tag=$IMAGE_TAG